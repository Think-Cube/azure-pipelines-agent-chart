    permissions:
      contents: read
      id-token: write
      packages: write
    uses: Think-Cube/workflows/.github/workflows/helm-chart.yml@v1.2.0
    with:
      # The ScaledJob only becomes ready with a real Azure DevOps organization.
      wait: legacy
