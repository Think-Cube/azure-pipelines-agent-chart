# Checks that the agent image pulls and starts with the chart's security settings.
# Registering a real agent needs Azure DevOps, so that is left to the template agent Job.
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test" (include "agent.fullname" . | trunc 58 | trimSuffix "-") }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- include "agent.podSpec" . | nindent 2 }}
  restartPolicy: Never
  containers:
    - name: agent-version
      image: {{ include "agent.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - /azp/bin/Agent.Listener
        - --version
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
