{{- if not .Values.azp.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.secretName" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  AZP_TOKEN: {{ required "azp.token is required when azp.existingSecret is empty" .Values.azp.token | quote }}
{{- end }}
